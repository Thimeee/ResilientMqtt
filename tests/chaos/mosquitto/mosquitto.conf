# Mosquitto for the ResilientMqtt chaos / load tests (works on Mosquitto 2.0 and 2.1).
# The container entrypoint copies this file, the ACL and the certificates into /m (owned by the mosquitto user) and
# creates /m/passwd (user "test" / password "test") — files bind-mounted from Windows can't be read by that user.
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
log_dest stdout
log_type error
log_type warning
log_type notice
max_queued_messages 20000
max_inflight_messages 20

# Same authentication for every listener
allow_anonymous false
password_file /m/passwd
acl_file /m/acl

# 1883 — plain TCP (refused sign-in / refused subscribe / refused publish tests)
listener 1883

# 8883 — TLS, server certificate issued by the test CA
listener 8883
cafile /m/ca.pem
certfile /m/server.pem
keyfile /m/server.key

# 8884 — mutual TLS, a client certificate issued by the test CA is required
listener 8884
cafile /m/ca.pem
certfile /m/server.pem
keyfile /m/server.key
require_certificate true
